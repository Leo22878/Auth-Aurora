<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
    <style>
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active  {
          transition: background-color 5000s;
          -webkit-fill-color: #252525 !important;
          -webkit-text-fill-color: #FFFFFF !important;
}
        body {
            font-family: Comfortaa, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            background-image: url("assets/background.png");
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            justify-content: center;
        }

        .form-box {
            background: rgba(39, 39, 39, 0.9) ; /* Новый полупрозрачный цвет */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 60%;
            max-width: 400px;
            text-align: center;
        }
        h2 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 24px;
        }
        input {
            font-family: Comfortaa, sans-serif;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            color: white;
            background-color: #252525;
            border: 4px solid #1871c8;
            border-radius: 20px;
            border-color: linear-gradient(90deg, rgba(20,242,255,1) 0%, rgba(255,10,233,1) 52%, rgba(0,35,255,1) 95%);;
            box-sizing: border-box;
            font-size: 16px;
            color: #ffffff; /* Белый цвет текста */
            text-align: center;
            transition: opacity 0.3s;
            }

        }
        input::placeholder {
        color: white; /* Цвет плейсхолдера белый */
        font-family: comfortaa;
        }
        input:hover {
            opacity: 0.5;
        }
        button {

        background: rgb(20,210,255);
        background: linear-gradient(90deg, rgba(20,210,255,1) 0%, rgba(188,0,255,1) 95%);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        p {
            font-size: 14px;
            margin-top: 15px;
            color: #ffffff;
        }
        p a {
            color: #5ee4ff;
            text-decoration: none;
        }
        p a:hover {
            text-decoration: underline;
        }
        .image-container {
            margin-top: 30px;
        }
        .image-container img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&display=swap" rel="stylesheet">
<body>
    <div class="form-box">
        <h2>Регистрация</h2>
        <form id="registerForm">
            <input type="text" autocomplete="off" name="login" placeholder="Логин" required>
            <input type="password" autocomplete="off" name="password" placeholder="Пароль" required>
            <button type="submit">Создать аккаунт</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">
            Уже есть аккаунт? <a href="/login.html">Войти</a>
        </p>
    </div>
    <div class="image-container">
        <img src="assets/pony.png" alt="Логотип">
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    login: e.target.login.value,
                    password: e.target.password.value
                })
            });
            
            const result = await response.json();
            if (result.success) {
                alert('Регистрация успешна!');
                window.location.href = '/login.html';
            } else {
                alert('Ошибка: ' + result.error);
            }
        });
    </script>
</body>
</html>
